<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="format-detection" content="telephone=no" />
    <!-- Critical CSS for the loading screen: inlined so it never waits on a network request.
         Keep it self-contained (no dependency on global.css). -->
    <style>
      body {
        margin: 0;
      }

      .loader {
        --ink: #373332;
        --ink-soft: #7a5b4d;
        --foam: #fdf8f4;
        --white: #ffffff;
        --drop: #daa047;
        --sun: #f0b863;

        position: fixed;
        inset: 0;
        z-index: 1000;
        display: grid;
        align-content: center;
        justify-items: center;
        gap: 1.1rem;
        padding: 2rem;
        color: var(--ink);
        font-family: ui-rounded, 'Hiragino Maru Gothic ProN', system-ui, sans-serif;
        font-weight: 700;
        /* same dots + warm gradient as the page backdrop in global.css */
        background-color: #f5e5dc;
        background-image:
          radial-gradient(circle at 1px 1px, rgb(255 255 255 / 0.6) 1.6px, transparent 0),
          linear-gradient(180deg, #fdf8f4 0%, #f9ecdf 26%, #f3ddc4 60%, #ecceac 100%);
        background-size:
          30px 30px,
          100% 100%;
        text-align: center;
      }

      .loader-wheel {
        width: 7.5rem;
        height: 7.5rem;
        filter: drop-shadow(4px 5px 0 rgb(55 51 50 / 0.22));
      }

      .loader-spin {
        transform-box: fill-box;
        transform-origin: center;
        animation: loader-spin 2.2s linear infinite;
      }

      .loader-rim {
        fill: var(--foam);
        stroke: var(--ink);
        stroke-width: 5;
      }

      .loader-rungs {
        fill: none;
        stroke: var(--sun);
        stroke-width: 7;
        stroke-dasharray: 21 13;
      }

      .loader-spokes {
        fill: none;
        stroke: var(--ink-soft);
        stroke-width: 2.5;
        stroke-linecap: round;
      }

      .loader-paw {
        transform-box: fill-box;
        transform-origin: center bottom;
        animation: loader-bob 0.55s ease-in-out infinite alternate;
      }

      .loader-paw ellipse {
        fill: var(--drop);
        stroke: var(--ink);
        stroke-width: 2.4;
      }

      .loader-title {
        font-size: 1.75rem;
        line-height: 1.1;
      }

      .loader-dots i {
        display: inline-block;
        width: 0.28em;
        height: 0.28em;
        margin-left: 0.18em;
        border-radius: 50%;
        background: var(--drop);
        animation: loader-dot 1.2s ease-in-out infinite;
      }

      .loader-dots i:nth-child(2) {
        animation-delay: 0.15s;
      }

      .loader-dots i:nth-child(3) {
        animation-delay: 0.3s;
      }

      .loader-bar {
        width: min(18rem, 72vw);
        height: 1.15rem;
        overflow: hidden;
        border: 3px solid var(--ink);
        border-radius: 999px;
        background: var(--white);
        box-shadow: 3px 3px 0 var(--ink);
      }

      .loader-fill {
        display: block;
        height: 100%;
        background:
          repeating-linear-gradient(135deg, rgb(255 255 255 / 0.35) 0 8px, transparent 8px 16px),
          var(--sun);
        background-size: 22.63px 22.63px, auto;
        transform: scaleX(var(--progress, 0.06));
        transform-origin: left;
        transition: transform 0.3s ease-out;
        animation: loader-stripes 0.8s linear infinite;
      }

      .loader-note {
        color: var(--ink-soft);
        font-size: 0.95rem;
        font-weight: 500;
      }

      @keyframes loader-spin {
        to {
          rotate: 360deg;
        }
      }

      @keyframes loader-bob {
        to {
          translate: 0 -5px;
          scale: 1 0.94;
        }
      }

      @keyframes loader-dot {
        0%,
        80%,
        100% {
          opacity: 0.25;
        }

        40% {
          opacity: 1;
        }
      }

      @keyframes loader-stripes {
        to {
          background-position: 22.63px 0, 0 0;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .loader-spin,
        .loader-paw,
        .loader-dots i,
        .loader-fill {
          animation: none;
        }

        .loader-dots i {
          opacity: 0.6;
        }
      }
    </style>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <noscript><style>#loader { display: none; }</style></noscript>
  </head>
  <body>
    <div id="loader" class="loader" role="status">
      <svg class="loader-wheel" viewBox="0 0 120 120" width="120" height="120" aria-hidden="true" focusable="false">
        <g class="loader-spin">
          <circle class="loader-rim" cx="60" cy="60" r="50" />
          <circle class="loader-rungs" cx="60" cy="60" r="40" />
          <path class="loader-spokes" d="M60 20v80M20 60h80M31.7 31.7l56.6 56.6M88.3 31.7 31.7 88.3" />
        </g>
        <g transform="translate(48 48) scale(0.75)">
          <g class="loader-paw">
            <ellipse cx="16" cy="21" rx="9" ry="7.5" />
            <ellipse cx="6.5" cy="12.5" rx="4" ry="5" />
            <ellipse cx="14.5" cy="7" rx="4" ry="5" />
            <ellipse cx="23.5" cy="9.5" rx="4" ry="5" />
          </g>
        </g>
      </svg>
      <p class="loader-title">
        Loading<span class="loader-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      </p>
      <div class="loader-bar" role="progressbar" aria-label="Loading progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <span class="loader-fill"></span>
      </div>
      <p class="loader-note">Waking up mizu...</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
